<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Convert Money</title>
</head>

<body>
    <div class="container">

        <!-- <img class="logo" src="./assets/img/logo.gif" alt="logo-convert-money"> -->
        <header>
            <h1>Convert Money</h1>
        </header>
        <main>
            <label for="">
                Converter <b>de</b>
                <select name="" id="">
                    <option value="">R$ <b>Real Brasileiro</b></option>
                </select>
            </label>

            <label>
                Converter <b>para</b>
                <select class="currency-select">
                    <option value="dolar">US$ <b>Dólar americano</b></option>
                    <option value="euro">€ <b>Euro</b></option>
                    <option value="libra">£ <b>Libra</b></option>
                    <option value="pesoa">£ <b>Peso Argentino</b></option>

                    <option value="bitcoin">₿ <b>Bitcoin</b></option>
                </select>
            </label>

            <label for="">Valor</label>
            <input class="input-currency" type="text" placeholder="R$ 10.000,00">

            <button class="convert-button">Converter</button>

            <section>
                <div class="currency-container">
                    <img src="./assets/img/brasil.png" alt="logo-moeda-brasil">
                    <p class="currency">Real</p>
                    <p class="currency-value-to-convert">R$ 0,00</p>
                </div>

                <img class="arrow-img" src="./assets/img/Vector.png" alt="seta">

                <div class="currency-box">
                    <img class="currency-img" src="./assets/img/usa.png" alt="logo-moeda-convertida">
                    <p class="currency" id="currency-name">Dólar americano</p>
                    <p class="currency-value">US$ 0.00</p>
                </div>
            </section>


        </main>
    </div>

</body>

</html>
